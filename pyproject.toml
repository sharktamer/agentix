[project]
name = "agentix"
version = "1.0.0"
description = "Plateforme pédagogique d'IA agentique locale"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "paramiko>=3.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]

[tool.uv]
dev-dependencies = []

[tool.uv.workspace]
members = [
    "agentix",
]
